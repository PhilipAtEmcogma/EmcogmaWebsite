name: Security Scan

on:
  push:
    branches: [main, master, develop, 'feature/*', 'security-*']
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for secret scanning

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  lint-security:
    name: Security Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx,.js,.jsx --max-warnings 0
        continue-on-error: true

      - name: Run security verification script
        run: node verify-security.js

  security-headers-check:
    name: Security Headers Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check security header configurations
        run: |
          # Verify security header files exist
          test -f lib/security/headers.ts || exit 1
          test -f lib/security/csp.ts || exit 1

          # Check for CSP configuration
          grep -q "Content-Security-Policy" lib/security/headers.ts || exit 1
          grep -q "Strict-Transport-Security" lib/security/headers.ts || exit 1

          echo "Security headers configuration validated"

  build-test:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
        env:
          # Use dummy values for build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
          RECAPTCHA_SECRET_KEY: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
          FORMSPREE_ENDPOINT: https://formspree.io/f/test
          NEXT_PUBLIC_SITE_URL: https://example.com
          KV_REST_API_URL: https://example.upstash.io
          KV_REST_API_TOKEN: example_token
          KV_REST_API_READ_ONLY_TOKEN: example_ro_token

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          npx license-checker --summary --production \
            --onlyAllow 'MIT;ISC;BSD;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Unlicense;WTFPL;LGPL-3.0-or-later'

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, lint-security, security-headers-check, build-test, license-check]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "Security Lint: ${{ needs.lint-security.result }}"
          echo "Headers Check: ${{ needs.security-headers-check.result }}"
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "License Check: ${{ needs.license-check.result }}"

      - name: Overall status
        run: |
          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "CRITICAL: Secret scan failed - secrets may be exposed!"
            exit 1
          fi

          if [[ "${{ needs.build-test.result }}" == "failure" ]]; then
            echo "ERROR: Build failed - deployment blocked"
            exit 1
          fi

          echo "Security checks completed"
